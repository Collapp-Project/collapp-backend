
# Aplicación

spring.application.name=project
server.port=8080
server.error.include-stacktrace=never

# Perfil activo. Por defecto ninguno: el DataSeeder solo se ejecuta bajo el perfil "dev",
# asi que un entorno que no lo declare nunca sembrara el admin de ejemplo.
# En local se activa con SPRING_PROFILES_ACTIVE=dev (ver .env.example).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Base de datos (PostgreSQL)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
# Cambiar a create-drop solo si se necesita resetear el esquema en cada arranque:
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
